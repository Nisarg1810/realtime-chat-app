<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Real-Time Chat</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>💬 Real-Time Chat</h1>
            <p class="subtitle">Connect with friends instantly</p>

            <!-- Login Form -->
            <div id="loginForm" class="form-container">
                <h2>Login</h2>
                <div id="loginError" class="error-message hidden"></div>
                
                <input 
                    type="text" 
                    id="loginUsername" 
                    placeholder="Username" 
                    autocomplete="username"
                    maxlength="20">
                
                <input 
                    type="password" 
                    id="loginPassword" 
                    placeholder="Password" 
                    autocomplete="current-password"
                    maxlength="50">
                
                <button id="loginBtn" class="primary-btn">Login</button>
                
                <p class="toggle-form">
                    Don't have an account? 
                    <a href="#" id="showRegister">Register here</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-container hidden">
                <h2>Register</h2>
                <div id="registerError" class="error-message hidden"></div>
                <div id="registerSuccess" class="success-message hidden"></div>
                
                <input 
                    type="text" 
                    id="registerUsername" 
                    placeholder="Username (min 3 characters)" 
                    autocomplete="username"
                    maxlength="20">
                
                <input 
                    type="password" 
                    id="registerPassword" 
                    placeholder="Password (min 6 characters)" 
                    autocomplete="new-password"
                    maxlength="50">
                
                <input 
                    type="password" 
                    id="registerConfirmPassword" 
                    placeholder="Confirm Password" 
                    autocomplete="new-password"
                    maxlength="50">
                
                <button id="registerBtn" class="primary-btn">Register</button>
                
                <p class="toggle-form">
                    Already have an account? 
                    <a href="#" id="showLogin">Login here</a>
                </p>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading-spinner hidden">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
