<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Analysis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Username Modal -->
    <div id="usernameModal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Analysis</h2>
            <input type="text" id="usernameInput" placeholder="Enter username" maxlength="20" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Enter password" maxlength="50" autocomplete="current-password">
            <div id="loginError" class="error-message hidden"></div>
            <button id="joinBtn">Join Chat</button>
        </div>
    </div>

    <!-- Main Chat Container -->
    <div id="chatContainer" class="chat-container hidden">
        <div class="chat-header">
            <h1>� Real-Time Analysis</h1>
            <div class="user-info">
                <span id="currentUsername"></span>
                <span id="onlineCount" class="online-count">● 1 online</span>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messageArea" class="message-area">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Reply Preview (hidden by default) -->
        <div id="replyPreview" class="reply-preview hidden">
            <div class="reply-content">
                <span class="reply-label">Replying to <strong id="replyUsername"></strong></span>
                <p id="replyText"></p>
            </div>
            <button id="cancelReply" class="cancel-reply">✕</button>
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message..." 
                maxlength="500"
                autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
